<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Figma Plugin – Auth</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0;
      background: #1e1e1e; color: #e0e0e0; font-size: 14px;
    }
    .box { text-align: center; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #333;
      border-top-color: #18a0fb; border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #888; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div id="msg">Authenticating…</div>
  <p id="sub">This window will close automatically.</p>
</div>

<script>
  // Parse access_token from URL hash (#access_token=...&token_type=Bearer&...)
  const hash   = window.location.hash.slice(1);
  const params = new URLSearchParams(hash);
  const token  = params.get('access_token');
  const error  = params.get('error');

  if (error) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'Auth error: ' + error;
    document.getElementById('sub').textContent = 'You can close this window.';
  } else if (token) {
    // Send token back to the Figma plugin UI (opener window)
    if (window.opener) {
      window.opener.postMessage({ type: 'gs_auth_token', token }, '*');
    }
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'Connected ✓';
    document.getElementById('sub').textContent = 'You can close this window.';
    setTimeout(() => window.close(), 1500);
  } else {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'No token received.';
    document.getElementById('sub').textContent = 'Please try again from the plugin.';
  }
</script>
</body>
</html>
